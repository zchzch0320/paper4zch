name: Daily Paper4ZCH Refresh

on:
  schedule:
    # Beijing 08:17, 12:17, 16:17, and 20:17. Only the first successful check publishes.
    - cron: "17 0,4,8,12 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/daily-refresh.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-paper4zch-refresh
  cancel-in-progress: false

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.daily-gate.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check whether Beijing today already succeeded
        id: daily-gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/daily_gate.mjs

      - name: Set up Node
        if: steps.daily-gate.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.daily-gate.outputs.should_run == 'true'
        run: npm ci

      - name: Refresh public paper feed
        if: steps.daily-gate.outputs.should_run == 'true'
        run: npm run refresh:cloud

      - name: Validate cloud refresh
        if: steps.daily-gate.outputs.should_run == 'true'
        run: npm run test:cloud

      - name: Build static site
        if: steps.daily-gate.outputs.should_run == 'true'
        run: npm run build:pages

      - name: Test Pages artifact
        if: steps.daily-gate.outputs.should_run == 'true'
        run: npm run test:pages

      - name: Upload refreshed feed state
        if: steps.daily-gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paper4zch-feed
          path: public/recommendations.json

      - name: Configure Pages
        if: steps.daily-gate.outputs.should_run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.daily-gate.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: gh-pages-dist

  deploy:
    if: needs.refresh-and-build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  save-refresh-state:
    if: needs.refresh-and-build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    needs: [refresh-and-build, deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download refreshed feed state
        uses: actions/download-artifact@v5
        with:
          name: paper4zch-feed
          path: .refresh

      - name: Record successful Beijing-day check
        run: |
          cp .refresh/recommendations.json public/recommendations.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/recommendations.json
          git commit -m "Record daily Paper4ZCH check"
          git push

